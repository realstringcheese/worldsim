<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronos: Earth 300,000 BCE</title>
  <!-- PixiJS WebGL Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
  <style>
    :root {
      --bg: #030712;
      --panel: rgba(15, 23, 42, 0.95);
      --border: #334155;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --green: #22c55e;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    #canvas-container canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #canvas-container canvas:active { cursor: grabbing; }

    /* Top HUD */
    .top-hud {
      position: fixed;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      z-index: 50;
      pointer-events: none;
    }
    .hud-card {
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 10px;
      pointer-events: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .era-badge {
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .year-display { font-size: 1.5rem; font-weight: 800; font-family: monospace; }

    /* Bottom Timeline Bar */
    .bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .milestones-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .milestone-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .milestone-btn:hover { border-color: var(--accent); color: #fff; }
    .milestone-btn.completed {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--green);
      color: var(--green);
      font-weight: 700;
    }

    .action-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-leap {
      background: #334155;
      color: #64748b;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: not-allowed;
      transition: all 0.3s;
      letter-spacing: 0.5px;
    }
    .btn-leap.unlocked {
      background: var(--gold);
      color: #030712;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* Intro Overlay - Isolated with Highest Z-Index */
    #intro-modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 20px;
      transition: opacity 0.5s ease;
    }
    #intro-modal h1 {
      font-size: 3.5rem;
      letter-spacing: 4px;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
    }
    #intro-modal p { color: #94a3b8; max-width: 500px; line-height: 1.6; margin-bottom: 28px; }
    .btn-start {
      background: var(--accent);
      color: #030712;
      border: none;
      padding: 16px 42px;
      font-size: 1.15rem;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-start:hover { transform: scale(1.06); background: #7dd3fc; }
  </style>
</head>
<body>

  <!-- Game Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Intro Modal (Active on load) -->
  <div id="intro-modal">
    <h1>CHRONOS</h1>
    <p>A living 8-bit simulation of Earth's true geography. The camera is locked to planetary bounds—zoom and pan freely.</p>
    <button class="btn-start" id="start-btn">ENTER 300,000 BCE</button>
  </div>

  <!-- Top HUD -->
  <div class="top-hud">
    <div class="hud-card">
      <div class="era-badge" id="era-label">PALEOLITHIC DAWN</div>
      <div class="year-display" id="year-label">300,000 BCE</div>
    </div>
    <div class="hud-card" style="text-align: right;">
      <div style="font-size: 0.8rem; color: #94a3b8;">GLOBAL POPULATION</div>
      <div style="font-weight: 800; color: #f8fafc; font-size: 1.3rem;" id="pop-label">1,500</div>
      <div style="font-size: 0.8rem; color: var(--gold); margin-top: 4px;">Zoom: <span id="zoom-text">1.0x</span></div>
    </div>
  </div>

  <!-- Bottom Interactive Timeline -->
  <div class="bottom-bar">
    <div class="milestones-group">
      <span style="font-size: 0.85rem; font-weight: bold; color: #cbd5e1;">Era Goals:</span>
      <button class="milestone-btn" id="m1">
        <span>🔥</span> Harness Controlled Fire
      </button>
      <button class="milestone-btn" id="m2">
        <span>🪓</span> Acheulean Handaxes
      </button>
      <button class="milestone-btn" id="m3">
        <span>🗣️</span> Form Clan Language
      </button>
    </div>

    <div class="action-group">
      <button class="btn-leap" id="leap-btn">⚡ CHRONOS LEAP</button>
    </div>
  </div>

  <script>
    let gameStarted = false;

    // 1. Initialize PixiJS WebGL Renderer
    PIXI.BaseTexture.defaultOptions.scaleMode = PIXI.SCALE_MODES.NEAREST;

    const app = new PIXI.Application({
      resizeTo: window,
      backgroundColor: 0x030712,
      antialias: false,
      resolution: window.devicePixelRatio || 1,
      autoDensity: true
    });
    
    const canvasElement = app.view;
    document.getElementById('canvas-container').appendChild(canvasElement);

    // Map Dimensions
    const MAP_WIDTH = 2048;
    const MAP_HEIGHT = 1024;

    // East African Rift Valley Coordinates
    const CAMP_POS = {
      x: Math.round(((36 + 180) / 360) * MAP_WIDTH),     // ~1229 px
      y: Math.round(((90 - (-3)) / 180) * MAP_HEIGHT)    // ~529 px
    };

    // Root World Container
    const world = new PIXI.Container();
    app.stage.addChild(world);

    // Layers
    const mapLayer = new PIXI.Container();
    const foliageLayer = new PIXI.Container();
    const entitiesLayer = new PIXI.Container();
    const fxLayer = new PIXI.Container();
    const beaconLayer = new PIXI.Container();
    world.addChild(mapLayer, foliageLayer, entitiesLayer, fxLayer, beaconLayer);

    // 2. Camera Clamping (Prevents moving into grey void)
    function clampCamera() {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const curScale = world.scale.x;
      const mw = MAP_WIDTH * curScale;
      const mh = MAP_HEIGHT * curScale;

      if (mw > sw) {
        world.x = Math.min(0, Math.max(sw - mw, world.x));
      } else {
        world.x = (sw - mw) / 2;
      }

      if (mh > sh) {
        world.y = Math.min(0, Math.max(sh - mh, world.y));
      } else {
        world.y = (sh - mh) / 2;
      }
    }

    function getMinZoom() {
      return Math.max(window.innerWidth / MAP_WIDTH, window.innerHeight / MAP_HEIGHT);
    }

    // 3. Texture Generators
    function createPixelTexture(w, h, drawFn) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      drawFn(ctx);
      return PIXI.Texture.from(c);
    }

    const humanTexture = createPixelTexture(16, 16, ctx => {
      ctx.fillStyle = '#b45309'; ctx.fillRect(5, 5, 6, 6);
      ctx.fillStyle = '#d97706'; ctx.fillRect(6, 2, 4, 4);
      ctx.fillStyle = '#1c1917'; ctx.fillRect(6, 1, 4, 2);
      ctx.fillStyle = '#92400e'; ctx.fillRect(5, 11, 2, 4); ctx.fillRect(9, 11, 2, 4);
      ctx.fillStyle = '#78350f'; ctx.fillRect(12, 1, 1, 14);
      ctx.fillStyle = '#94a3b8'; ctx.fillRect(11, 0, 3, 2);
    });

    const treeTexture = createPixelTexture(24, 24, ctx => {
      ctx.fillStyle = '#451a03'; ctx.fillRect(11, 12, 2, 10); ctx.fillRect(9, 10, 3, 2); ctx.fillRect(12, 9, 4, 2);
      ctx.fillStyle = '#15803d'; ctx.fillRect(4, 5, 16, 4); ctx.fillRect(2, 6, 20, 2);
      ctx.fillStyle = '#4ade80'; ctx.fillRect(5, 5, 6, 1); ctx.fillRect(13, 5, 5, 1);
    });

    // 4. Load Earth Map
    const earthMapUrl = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/earth_atmos_2048.jpg';
    const fallbackCanvas = document.createElement('canvas');
    fallbackCanvas.width = MAP_WIDTH; fallbackCanvas.height = MAP_HEIGHT;
    const fctx = fallbackCanvas.getContext('2d');
    fctx.fillStyle = '#0f172a'; fctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
    const mapSprite = new PIXI.Sprite(PIXI.Texture.from(fallbackCanvas));
    mapSprite.width = MAP_WIDTH; mapSprite.height = MAP_HEIGHT;
    mapLayer.addChild(mapSprite);

    PIXI.Assets.load(earthMapUrl).then(tex => {
      tex.baseTexture.scaleMode = PIXI.SCALE_MODES.NEAREST;
      mapSprite.texture = tex;
    });

    // 5. Populate Camp
    const fireGraphic = new PIXI.Graphics();
    fxLayer.addChild(fireGraphic);

    const smokeParticles = [];
    for (let i = 0; i < 15; i++) {
      const p = new PIXI.Graphics();
      p.beginFill(0x94a3b8, 0.6); p.drawCircle(0, 0, 1.5); p.endFill();
      p.x = CAMP_POS.x; p.y = CAMP_POS.y - 4;
      p.vy = -0.3 - Math.random() * 0.4; p.vx = (Math.random() - 0.5) * 0.2;
      p.alpha = Math.random();
      smokeParticles.push(p);
      fxLayer.addChild(p);
    }

    const humans = [];
    function spawnHuman(x, y) {
      const s = new PIXI.Sprite(humanTexture);
      s.anchor.set(0.5, 0.8);
      s.x = x + (Math.random() * 40 - 20);
      s.y = y + (Math.random() * 40 - 20);
      s.vx = (Math.random() - 0.5) * 0.3;
      s.vy = (Math.random() - 0.5) * 0.3;
      entitiesLayer.addChild(s);
      humans.push(s);
    }
    for (let i = 0; i < 14; i++) spawnHuman(CAMP_POS.x, CAMP_POS.y);

    for (let i = 0; i < 45; i++) {
      const tree = new PIXI.Sprite(treeTexture);
      tree.anchor.set(0.5, 1);
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 140;
      tree.x = CAMP_POS.x + Math.cos(angle) * dist;
      tree.y = CAMP_POS.y + Math.sin(angle) * dist;
      foliageLayer.addChild(tree);
    }

    const beacon = new PIXI.Graphics();
    beaconLayer.addChild(beacon);

    // Initial scale & position
    world.scale.set(getMinZoom());
    clampCamera();

    // 6. Camera Controls (Only active AFTER clicking Start)
    let camera = { isLerping: false, targetX: 0, targetY: 0, targetScale: 1 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let worldStart = { x: 0, y: 0 };

    window.addEventListener('resize', () => {
      const minZ = getMinZoom();
      if (world.scale.x < minZ) world.scale.set(minZ);
      clampCamera();
    });

    // Pointer events tied strictly to the CANVAS (cannot hijack buttons)
    canvasElement.addEventListener('pointerdown', e => {
      if (!gameStarted) return; // Ignore drag clicks if modal is up
      isDragging = true;
      camera.isLerping = false;
      canvasElement.setPointerCapture(e.pointerId);
      dragStart = { x: e.clientX, y: e.clientY };
      worldStart = { x: world.x, y: world.y };
    });

    canvasElement.addEventListener('pointermove', e => {
      if (!isDragging || !gameStarted) return;
      world.x = worldStart.x + (e.clientX - dragStart.x);
      world.y = worldStart.y + (e.clientY - dragStart.y);
      clampCamera();
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      try { canvasElement.releasePointerCapture(e.pointerId); } catch(err) {}
    }
    canvasElement.addEventListener('pointerup', endDrag);
    canvasElement.addEventListener('pointercancel', endDrag);

    // Wheel Zoom
    canvasElement.addEventListener('wheel', e => {
      if (!gameStarted) return;
      e.preventDefault();
      camera.isLerping = false;

      const zoomFactor = e.deltaY < 0 ? 1.25 : 0.8;
      const minZ = getMinZoom();
      const newScale = Math.min(Math.max(world.scale.x * zoomFactor, minZ), 32.0);

      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const worldPos = {
        x: (mouseX - world.x) / world.scale.x,
        y: (mouseY - world.y) / world.scale.y
      };

      world.scale.set(newScale);
      world.x = mouseX - worldPos.x * newScale;
      world.y = mouseY - worldPos.y * newScale;
      clampCamera();

      document.getElementById('zoom-text').innerText = newScale.toFixed(1) + 'x';
    }, { passive: false });

    // Focus Helper
    function focusOnCamp(targetZoom = 18.0) {
      camera.isLerping = true;
      camera.targetScale = targetZoom;
      camera.targetX = window.innerWidth / 2 - (CAMP_POS.x * targetZoom);
      camera.targetY = window.innerHeight / 2 - (CAMP_POS.y * targetZoom);
    }

    // 7. Intro Button Hookup
    document.getElementById('start-btn').addEventListener('click', () => {
      gameStarted = true;
      const modal = document.getElementById('intro-modal');
      modal.style.opacity = '0';
      setTimeout(() => {
        modal.style.display = 'none'; // Completely removes modal & blur
      }, 500);

      focusOnCamp(16.0); // Smooth dive from orbit into East Africa
    });

    // 8. Milestones & Chronos Leap Logic
    let currentYear = 300000;
    let milestones = { 1: false, 2: false, 3: false };

    function checkMilestoneUnlock() {
      const allDone = milestones[1] && milestones[2] && milestones[3];
      const leapBtn = document.getElementById('leap-btn');
      if (allDone) {
        leapBtn.classList.add('unlocked');
        leapBtn.innerText = "⚡ CHRONOS LEAP READY!";
      } else {
        leapBtn.classList.remove('unlocked');
        leapBtn.innerText = "⚡ CHRONOS LEAP";
      }
    }

    document.getElementById('m1').addEventListener('click', function() {
      milestones[1] = !milestones[1];
      this.classList.toggle('completed', milestones[1]);
      checkMilestoneUnlock();
    });

    document.getElementById('m2').addEventListener('click', function() {
      milestones[2] = !milestones[2];
      this.classList.toggle('completed', milestones[2]);
      checkMilestoneUnlock();
    });

    document.getElementById('m3').addEventListener('click', function() {
      milestones[3] = !milestones[3];
      this.classList.toggle('completed', milestones[3]);
      checkMilestoneUnlock();
    });

    document.getElementById('leap-btn').addEventListener('click', function() {
      const allDone = milestones[1] && milestones[2] && milestones[3];
      if (!allDone) {
        alert("Click and complete all 3 Era Goals in the bottom bar first!");
        return;
      }

      currentYear = 70000;
      document.getElementById('year-label').innerText = "70,000 BCE";
      document.getElementById('era-label').innerText = "THE COASTAL MIGRATION";
      document.getElementById('pop-label').innerText = "45,000";

      // Spawn second human camp across the Red Sea into Arabia
      const redSeaPos = { x: CAMP_POS.x + 80, y: CAMP_POS.y - 120 };
      for (let i = 0; i < 15; i++) spawnHuman(redSeaPos.x, redSeaPos.y);

      alert("⚡ CHRONOS LEAP! Advanced to 70,000 BCE.\nHumans have crossed the Red Sea into Arabia and the Levant!");

      // Reset for next era
      milestones = { 1: false, 2: false, 3: false };
      const m1 = document.getElementById('m1');
      const m2 = document.getElementById('m2');
      const m3 = document.getElementById('m3');
      m1.className = 'milestone-btn'; m1.innerHTML = '<span>🏹</span> Composite Bows';
      m2.className = 'milestone-btn'; m2.innerHTML = '<span>🛶</span> Coastal Rafts';
      m3.className = 'milestone-btn'; m3.innerHTML = '<span>🎨</span> Cave Art Traditions';
      this.classList.remove('unlocked');
      this.innerText = "⚡ CHRONOS LEAP";
    });

    // 9. Main Render Loop
    let ticker = 0;
    app.ticker.add(() => {
      ticker += 0.05;

      // Pass time slowly once game is started
      if (gameStarted && currentYear > 10000) {
        currentYear -= 1;
        document.getElementById('year-label').innerText = currentYear.toLocaleString() + ' BCE';
      }

      // Smooth Camera LERP
      if (camera.isLerping) {
        world.x += (camera.targetX - world.x) * 0.06;
        world.y += (camera.targetY - world.y) * 0.06;
        const currentScale = world.scale.x;
        const nextScale = currentScale + (camera.targetScale - currentScale) * 0.06;
        world.scale.set(nextScale);
        clampCamera();
        document.getElementById('zoom-text').innerText = nextScale.toFixed(1) + 'x';

        if (Math.abs(camera.targetScale - nextScale) < 0.01) {
          camera.isLerping = false;
        }
      }

      const currentZoom = world.scale.x;
      const showMicroDetail = currentZoom >= 3.5;
      foliageLayer.visible = showMicroDetail;
      entitiesLayer.visible = showMicroDetail;
      fxLayer.visible = showMicroDetail;

      // Orbit Beacon
      beacon.clear();
      if (!showMicroDetail) {
        const pulse = Math.sin(ticker * 2) * 2;
        beacon.beginFill(0xfbbf24, 0.4);
        beacon.drawCircle(CAMP_POS.x, CAMP_POS.y, 8 + pulse);
        beacon.beginFill(0x38bdf8, 1);
        beacon.drawCircle(CAMP_POS.x, CAMP_POS.y, 3);
        beacon.endFill();
      }

      // Ground Level Animations
      if (showMicroDetail) {
        fireGraphic.clear();
        fireGraphic.beginFill(0xf97316);
        fireGraphic.drawRect(CAMP_POS.x - 2, CAMP_POS.y - 2, 4 + Math.sin(ticker * 5), 4 + Math.cos(ticker * 5));
        fireGraphic.beginFill(0xfef08a);
        fireGraphic.drawRect(CAMP_POS.x - 1, CAMP_POS.y - 1, 2, 2);
        fireGraphic.endFill();

        smokeParticles.forEach(p => {
          p.y += p.vy; p.x += p.vx; p.alpha -= 0.008;
          if (p.alpha <= 0) {
            p.x = CAMP_POS.x + (Math.random() - 0.5) * 2;
            p.y = CAMP_POS.y - 3;
            p.alpha = 0.7;
          }
        });

        humans.forEach(h => {
          h.x += h.vx; h.y += h.vy;
          if (Math.hypot(h.x - CAMP_POS.x, h.y - CAMP_POS.y) > 50) {
            h.vx *= -1; h.vy *= -1;
          }
        });
      }
    });
  </script>
</body>
</html>
